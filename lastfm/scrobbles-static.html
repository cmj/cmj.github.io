<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Scrobbles (static)</title>
<style>
  html, body {
    margin: 0;
    background: transparent;
  }
  #svg-container svg {
    display: block;
  }
</style>
</head>
<body>
<div id="svg-container">Loading…</div>

<script>
  // The scrobbler svg uses an animated equalizer that chews up way too much
	// CPU when embedded in plasmashell desktop, this wrapper will freeze or
	// remove it
	
	const SVG_URL = "https://lastfm-recently-played.vercel.app/api?user=cmjsea&count=10&loved=true&loved_style=4&border_radius=20&header_size=none"; // <-- change me

  // Set to true to delete the equalizer bars completely instead of just freezing them.
  const REMOVE_EQUALIZER = true;

  fetch(SVG_URL, { cache: "no-store" })
    .then((res) => {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    })
    .then((svgText) => {
      const container = document.getElementById("svg-container");
      container.innerHTML = svgText;

      const svg = container.querySelector("svg");
      if (!svg) return;

      // Strip the @keyframes rule and any "animation:" declarations from
      // the embedded <style> so the browser never starts the loop.
      svg.querySelectorAll("style").forEach((styleEl) => {
        styleEl.textContent = styleEl.textContent
          .replace(/@keyframes[\s\S]*?\{[\s\S]*?\{[\s\S]*?\}[\s\S]*?\}/g, "")
          .replace(/animation:\s*[^;]+;?/g, "animation: none;");
      });

      const bars = svg.querySelectorAll(".lfmrbdaln-eq");
      if (REMOVE_EQUALIZER) {
        bars.forEach((bar) => bar.remove());
      } else {
        // Freeze each bar at full height (the "playing" end state) rather
        // than the squashed 0.22 start of the keyframe.
        bars.forEach((bar) => {
          bar.style.animation = "none";
          bar.style.transform = "scaleY(1)";
        });
      }
    })
    .catch((err) => {
      document.getElementById("svg-container").textContent =
        "Failed to load SVG: " + err.message;
    });
</script>
</body>
</html>
